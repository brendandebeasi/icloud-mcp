[project]
name = "icloud-mcp"
version = "0.2.0"
description = "MCP server for iCloud: Calendar (CalDAV), Contacts (CardDAV) and Mail (IMAP/SMTP). Runs locally over stdio or as a stateless Streamable HTTP service."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "icloud", "caldav", "carddav", "imap", "smtp", "claude"]
dependencies = [
    "fastmcp>=4.0,<5",
    "caldav>=2.0",
    "icalendar>=6.0",
    "vobject>=0.9.6",
    "imapclient>=3.0.1",
    "inscriptis>=2.5.0",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[project.urls]
Repository = "https://github.com/mike-tih/icloud-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
